<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tài nguyên — SpendWise Coach</title>
<link rel="stylesheet" href="../css/base.css?v=2">
<link rel="stylesheet" href="../css/app.css">
</head>
<body data-role="coach" data-page="Tài nguyên" data-auth="required">

<main class="main">
  <div class="topbar">
    <div class="row" style="gap:12px">
      <div><h1>Quản lý tài nguyên</h1><div class="sub">Bài viết, video &amp; checklist chia sẻ cho học viên</div></div>
    </div>
    <div class="row">
      <button class="icon-btn" id="themeBtn">🌙</button>
      <button class="btn btn-accent btn-sm" id="newRes">+ Tạo tài nguyên</button>
    </div>
  </div>

  <div class="stats">
    <div class="card stat hoverable"><span class="s-label">Đã xuất bản</span><span class="s-value" data-count="24">0</span><span class="s-foot">tổng số tài nguyên công khai</span></div>
    <div class="card stat hoverable"><span class="s-label">Chờ duyệt</span><span class="s-value" style="color:var(--yellow)" data-count="5">0</span><span class="s-foot">đang ở đội kiểm duyệt</span></div>
    <div class="card stat hoverable"><span class="s-label">Bản nháp</span><span class="s-value" data-count="2">0</span><span class="s-foot">chưa gửi duyệt</span></div>
  </div>

  <div class="card">
    <div class="panel-head" style="padding-bottom:12px">
      <div class="row"><h3>Tất cả tài nguyên</h3><span class="badge b-gray"><span data-row-count>5</span> mục</span></div>
      <div class="input-wrap" style="max-width:230px">
        <span class="search-ico">🔍</span>
        <input class="input" data-live="#resTable" placeholder="Tìm tài nguyên...">
      </div>
    </div>
    <div class="table-wrap">
      <table class="tbl" id="resTable">
        <thead><tr><th>Tài nguyên</th><th>Định dạng</th><th>Đối tượng</th><th>Cập nhật</th><th>Trạng thái</th></tr></thead>
        <tbody data-select-rows></tbody>
      </table>
    </div>
  </div>

  <div class="selbar" data-selbar>
    <span>Đã chọn: <b data-selbar-label>—</b></span>
    <span class="grow"></span>
    <button class="btn btn-accent btn-sm" id="previewBtn">👁 Xem trước</button>
    <button class="btn btn-ghost btn-sm" id="editResBtn">✏️ Sửa</button>
    <button class="btn btn-ghost btn-sm" id="submitBtn">📤 Gửi duyệt</button>
  </div>
</main>

<script src="../js/data.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/charts.js"></script>
<script>
  initAppPage();

  $("[data-select-rows]").innerHTML = SW_DATA.resources.map(r => `
    <tr>
      <td><div class="tx-desc"><span class="tx-ico">${r.fmtIco}</span><b>${r.title}</b></div></td>
      <td><span class="badge b-gray">${r.fmt}</span></td>
      <td class="muted">${r.who}</td>
      <td class="muted">${r.updated}</td>
      <td><span class="st st-${r.st}">${r.status}</span></td>
    </tr>`).join("");

  initRowSelect();
  initLiveFilter();

  $("#previewBtn").addEventListener("click", () => toast("Mở bản xem trước tài nguyên (demo)", "👁"));
  $("#editResBtn").addEventListener("click", () => toast("Mở trình soạn thảo (demo)", "✏️"));
  $("#submitBtn").addEventListener("click", () => toast("Đã gửi tới đội kiểm duyệt — SLA 18 giờ", "📤"));
  $("#newRes").addEventListener("click", () => toast("Tạo tài nguyên mới (demo)", "✨"));

  $("#themeBtn").addEventListener("click", () => { const dark = toggleTheme(); $("#themeBtn").textContent = dark ? "☀️" : "🌙"; });
  if (document.documentElement.dataset.theme === "dark") $("#themeBtn").textContent = "☀️";
</script>
</body>
</html>
